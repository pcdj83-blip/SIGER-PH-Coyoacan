<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SIGER - Coyoacán</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 13px;
      opacity: .85;
    }

    .content {
      padding: 25px 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      color: #1f2937;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #006847;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .scanner {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }

      .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      color: #374151;
      word-break: break-word;
      white-space: pre-line;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .back {
      margin-top: 15px;
      background: #374151;
    }

    .footer {
      text-align: center;
      padding: 18px;
      color: #9ca3af;
      font-size: 12px;
      border-top: 1px solid #e5e7eb;
    }

  </style>

</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      SIGER
    </div>

    <div class="subtitle">
      Sistema Integral de Gestión de Recorridos
    </div>

  </header>


  <!-- INICIO -->

  <main id="inicio" class="content">

    <div class="welcome">

      <h2>
        Iniciar recorrido
      </h2>

      <p>
        Selecciona el usuario para comenzar.
      </p>

    </div>

    <div class="field">

      <label for="usuario">
        Usuario
      </label>

      <select id="usuario">

        <option value="">
          Seleccionar usuario
        </option>

        <option value="demo">
          Usuario de prueba
        </option>

      </select>

    </div>

    <button onclick="iniciarRecorrido()">

      INICIAR RECORRIDO

    </button>

  </main>


  <!-- ESCANEO -->

  <main id="scanner" class="content scanner">

    <div class="welcome">

      <h2>
        Recorrido activo
      </h2>

      <p id="usuarioActivo">
        Usuario de prueba
      </p>

    </div>

    <div id="reader"></div>

    <div id="resultado" class="status">

      Esperando código QR...

    </div>

    <button
      class="back"
      onclick="volverInicio()">

      VOLVER

    </button>

  </main>


  <footer class="footer">

    SIGER PH - Coyoacán<br>
    Versión 1.0

  </footer>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbywz0RkRwfK8x3goP7_fprReHnD3A3FI5xI7cuoxG3S8CxLv8FZfLkRnfva6wWxsiuC/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scannerQR = null;

let escaneoProcesado = false;


/* =====================================================
   INICIAR RECORRIDO
   ===================================================== */

function iniciarRecorrido() {

  const usuario =
    document.getElementById("usuario").value;

  if (!usuario) {

    alert("Selecciona un usuario para continuar.");

    return;

  }

  mostrarResultado(
    "Iniciando recorrido..."
  );

  const callback = "sigerInicioRespuesta";

  const url =
    URL_BACKEND +
    "?accion=iniciar" +
    "&usuario=" +
    encodeURIComponent(usuario) +
    "&callback=" +
    callback;

  const script =
    document.createElement("script");

  script.src = url;

  script.onerror = function() {

    mostrarError(
      "No fue posible iniciar el recorrido."
    );

    script.remove();

  };

  document.body.appendChild(script);

}

function sigerInicioRespuesta(respuesta) {

  if (!respuesta.ok) {

    mostrarError(
      respuesta.mensaje ||
      "No fue posible iniciar el recorrido."
    );

    return;

  }

  /*
   * Guardamos el ID del recorrido
   */

  idRecorrido =
    respuesta.idRecorrido;


  /*
   * Mostramos usuario e ID del recorrido
   */

  document.getElementById(
    "usuarioActivo"
  ).textContent =
    respuesta.usuario +
    " | " +
    respuesta.idRecorrido;


  /*
   * Mostramos la pantalla del recorrido
   */

  document.getElementById(
    "inicio"
  ).style.display = "none";


  document.getElementById(
    "scanner"
  ).style.display = "block";


  /*
   * Iniciamos la cámara
   */

  iniciarCamara();

}  

/* =====================================================
   CÁMARA
   ===================================================== */

function iniciarCamara() {

  scannerQR =
    new Html5Qrcode("reader");

  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };

  scannerQR.start(

    {
      facingMode: "environment"
    },

    configuracion,

    codigoDetectado,

    errorEscaneo

  )

  .catch(function(error) {

    mostrarError(
      "No fue posible acceder a la cámara."
    );

    console.error(error);

  });

}


/* =====================================================
   QR DETECTADO
   ===================================================== */

function codigoDetectado(codigo) {

  if (escaneoProcesado) {
    return;
  }

  escaneoProcesado = true;

  mostrarResultado(
    "QR leído: " + codigo
  );

  enviarAlBackend(codigo);

}


/* =====================================================
   ENVIAR A APPS SCRIPT
   ===================================================== */

function enviarAlBackend(codigo) {

  if (
    !URL_BACKEND ||
    URL_BACKEND.includes("PEGA_AQUI")
  ) {

    mostrarError(
      "La URL del backend todavía no está configurada."
    );

    escaneoProcesado = false;

    return;

  }


  if (!idRecorrido) {

    mostrarError(
      "No existe un recorrido activo."
    );

    escaneoProcesado = false;

    return;

  }


  const usuario =
    document.getElementById("usuario").value;


  const callback =
    "sigerRespuesta";


  const url =
    URL_BACKEND +
    "?accion=registrar" +
    "&codigo=" +
    encodeURIComponent(codigo) +
    "&usuario=" +
    encodeURIComponent(usuario) +
    "&idRecorrido=" +
    encodeURIComponent(idRecorrido) +
    "&callback=" +
    callback;


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror = function() {

    mostrarError(
      "No fue posible registrar el escaneo."
    );

    escaneoProcesado = false;

    script.remove();

  };


  document.body.appendChild(script);

}


/* =====================================================
   RESPUESTA DEL BACKEND
   ===================================================== */

function sigerRespuesta(respuesta) {

  if (respuesta.ok) {

    const mensaje = `
      ✓ PUNTO IDENTIFICADO

      ${respuesta.punto || "Sin nombre"}

      ${respuesta.piso || ""}

      Código: ${respuesta.codigo}

      Estado: ${respuesta.estado || "Sin estado"}
    `;

    mostrarResultado(mensaje);

  } else {

    mostrarError(
      "⚠ " +
      (respuesta.mensaje ||
      "El punto no pudo ser identificado.")
    );

  }

  setTimeout(function() {

    escaneoProcesado = false;

  }, 2500);

}


/* =====================================================
   MENSAJES
   ===================================================== */

function mostrarResultado(mensaje) {

  const resultado =
    document.getElementById("resultado");

  resultado.className =
    "status success";

  resultado.textContent =
    mensaje;

}


function mostrarError(mensaje) {

  const resultado =
    document.getElementById("resultado");

  resultado.className =
    "status error";

  resultado.textContent =
    mensaje;

}


/* =====================================================
   ERROR DEL ESCÁNER
   ===================================================== */

function errorEscaneo(error) {

  // No mostramos los errores normales
  // mientras el lector busca un QR.

}


/* =====================================================
   VOLVER
   ===================================================== */

function volverInicio() {

  if (scannerQR) {

    scannerQR.stop()

      .then(function() {

        scannerQR.clear();

        scannerQR = null;

        mostrarInicio();

      })

      .catch(function() {

        mostrarInicio();

      });

  } else {

    mostrarInicio();

  }

}


function mostrarInicio() {

  document.getElementById("scanner").style.display =
    "none";

  document.getElementById("inicio").style.display =
    "block";

  document.getElementById("resultado").className =
    "status";

  document.getElementById("resultado").textContent =
    "Esperando código QR...";

}

</script>

</body>

</html>
