<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>SIGER - Coyoacán</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    .btn-finalizar {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #b91c1c;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.btn-finalizar:active {
  transform: scale(0.98);
}
    
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: white;
    }

    .header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    .logo {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .subtitle {
      margin-top: 7px;
      font-size: 13px;
      opacity: .85;
    }

    .content {
      padding: 25px 20px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 30px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      color: #1f2937;
    }

    .welcome p {
      margin: 0;
      color: #6b7280;
      font-size: 14px;
    }

    .field {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #374151;
    }

    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #006847;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .scanner {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      overflow: hidden;
    }

      .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      color: #374151;
      word-break: break-word;
      white-space: pre-line;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .contador-recorrido {
  margin-top: 15px;
  padding: 12px 15px;
  border-radius: 10px;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  color: #374151;
  font-size: 14px;
  line-height: 1.8;
}

.contador-recorrido strong {
  color: #111827;
}
    
    .historial {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
  background: #f9fafb;
  border: 1px solid #e5e7eb;
}

.historial-titulo {
  font-weight: bold;
  color: #374151;
  margin-bottom: 10px;
  text-align: center;
}

.historial-item {
  padding: 8px 0;
  border-bottom: 1px solid #e5e7eb;
  font-size: 13px;
  color: #374151;
}

.historial-item:last-child {
  border-bottom: none;
}

.historial-codigo {
  font-weight: bold;
  color: #166534;
}

.historial-hora {
  color: #6b7280;
  font-size: 12px;
}
    
    .back {
      margin-top: 15px;
      background: #374151;
    }

    .footer {
      text-align: center;
      padding: 18px;
      color: #9ca3af;
      font-size: 12px;
      border-top: 1px solid #e5e7eb;
    }

  </style>

</head>

<body>

<div class="app">

  <header class="header">

    <div class="logo">
      SIGER
    </div>

    <div class="subtitle">
      Sistema Integral de Gestión de Recorridos
    </div>

  </header>


  <!-- INICIO -->

  <main id="inicio" class="content">

    <div class="welcome">

      <h2>
        Iniciar recorrido
      </h2>

      <p>
        Selecciona el usuario para comenzar.
      </p>

    </div>

    <div class="field">

      <label for="usuario">
        Usuario
      </label>

      <select id="usuario">

        <option value="">
          Seleccionar usuario
        </option>

        <option value="demo">
          Usuario de prueba
        </option>

      </select>

    </div>

    <button onclick="iniciarRecorrido()">

      INICIAR RECORRIDO

    </button>

  </main>


  <!-- ESCANEO -->

  <main id="scanner" class="content scanner">

    <div class="welcome">

      <h2>
        Recorrido activo
      </h2>

      <p id="usuarioActivo">
        Usuario de prueba
      </p>

    </div>

    <div id="reader"></div>

    <div id="resultado" class="status">

      Esperando código QR...

    </div>

    <div id="contadorRecorrido" class="contador-recorrido">

  <div>
    <strong>Puntos registrados:</strong>
    <span id="cantidadPuntos">0</span>
  </div>

  <div>
    <strong>Último punto:</strong>
    <span id="ultimoPunto">—</span>
  </div>

</div>
    
    <div id="historial" class="historial">

  <div class="historial-titulo">
    Puntos registrados
  </div>

  <div id="listaHistorial">
    Aún no hay puntos registrados.
  </div>

</div>
    
    <button
  onclick="finalizarRecorrido()"
  class="btn-finalizar">
  FINALIZAR RECORRIDO
</button>
    
    <button
      class="back"
      onclick="volverInicio()">

      VOLVER

    </button>

  </main>


  <footer class="footer">

    SIGER PH - Coyoacán<br>
    Versión 1.0

  </footer>

</div>


<script>

/* =====================================================
   CONFIGURACIÓN
   ===================================================== */

const URL_BACKEND =
  "https://script.google.com/macros/s/AKfycbywz0RkRwfK8x3goP7_fprReHnD3A3FI5xI7cuoxG3S8CxLv8FZfLkRnfva6wWxsiuC/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let scannerQR = null;

let escaneoProcesado = false;

let idRecorrido = null;

/*
 * Puntos registrados durante el recorrido actual
 */
let puntosRecorridos = new Set();

/*
 * Historial visual del recorrido
 */
let historialRecorrido = [];

/* =====================================================
   INICIAR RECORRIDO
   ===================================================== */

function iniciarRecorrido() {

  const usuario =
    document.getElementById("usuario").value;

  if (!usuario) {

    alert("Selecciona un usuario para continuar.");

    return;

  }

  mostrarResultado(
    "Iniciando recorrido..."
  );

  const callback = "sigerInicioRespuesta";

  const url =
    URL_BACKEND +
    "?accion=iniciar" +
    "&usuario=" +
    encodeURIComponent(usuario) +
    "&callback=" +
    callback;

  const script =
    document.createElement("script");

  script.src = url;

  script.onerror = function() {

    mostrarError(
      "No fue posible iniciar el recorrido."
    );

    script.remove();

  };

  document.body.appendChild(script);

}

function sigerInicioRespuesta(respuesta) {

  if (!respuesta.ok) {

    mostrarError(
      respuesta.mensaje ||
      "No fue posible iniciar el recorrido."
    );

    return;

  }

  /*
   * Guardamos el ID del recorrido
   */

  idRecorrido =
    respuesta.idRecorrido;

  /*
 * Iniciamos un historial nuevo
 */
puntosRecorridos = new Set();

historialRecorrido = [];

mostrarHistorial();

  /*
   * Mostramos usuario e ID del recorrido
   */

  document.getElementById(
    "usuarioActivo"
  ).textContent =
    respuesta.usuario +
    " | " +
    respuesta.idRecorrido;


  /*
   * Mostramos la pantalla del recorrido
   */

  document.getElementById(
    "inicio"
  ).style.display = "none";


  document.getElementById(
    "scanner"
  ).style.display = "block";


  /*
   * Iniciamos la cámara
   */

  iniciarCamara();

}  

  function finalizarRecorrido() {

  if (!idRecorrido) {

    mostrarError(
      "No existe un recorrido activo."
    );

    return;

  }


  const confirmar =
    confirm(
      "¿Deseas finalizar este recorrido?"
    );


  if (!confirmar) {

    return;

  }


  mostrarResultado(
    "Finalizando recorrido..."
  );


  const callback =
    "sigerFinalizarRespuesta";


  const url =
    URL_BACKEND +
    "?accion=finalizar" +
    "&idRecorrido=" +
    encodeURIComponent(idRecorrido) +
    "&callback=" +
    callback;


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror = function() {

    mostrarError(
      "No fue posible finalizar el recorrido."
    );

    script.remove();

  };


  document.body.appendChild(script);

}

  function sigerFinalizarRespuesta(respuesta) {

  if (!respuesta.ok) {

    mostrarError(
      respuesta.mensaje ||
      "No fue posible finalizar el recorrido."
    );

    return;

  }


  /*
   * Detener la cámara
   */

  if (scannerQR) {

  scannerQR.stop()
    .then(function() {

      return scannerQR.clear();

    })
    .catch(function() {

      return scannerQR.clear();

    })
    .finally(function() {

      scannerQR = null;

    });

}


  /*
   * Mostrar confirmación
   */

  mostrarResultado(
    "✓ RECORRIDO FINALIZADO\n\n" +
    "ID: " +
    respuesta.idRecorrido +
    "\n\n" +
    "Fin: " +
    new Date(
      respuesta.fin
    ).toLocaleString()
  );


  /*
   * Ya no existe recorrido activo
   */

  idRecorrido = null;


  /*
   * Después de unos segundos,
   * regresar a la pantalla inicial.
   */

  setTimeout(function() {

    document.getElementById(
      "scanner"
    ).style.display = "none";


    document.getElementById(
      "inicio"
    ).style.display = "block";


    document.getElementById(
      "usuarioActivo"
    ).textContent = "";

  }, 3000);

}
  
/* =====================================================
   CÁMARA
   ===================================================== */

function iniciarCamara() {

  scannerQR =
    new Html5Qrcode("reader");

  const configuracion = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };

  scannerQR.start(

    {
      facingMode: "environment"
    },

    configuracion,

    codigoDetectado,

    errorEscaneo

  )

  .catch(function(error) {

    mostrarError(
      "No fue posible acceder a la cámara."
    );

    console.error(error);

  });

}


/* =====================================================
   QR DETECTADO
   ===================================================== */

function codigoDetectado(codigo) {

  if (escaneoProcesado) {
    return;
  }

  escaneoProcesado = true;


  /*
   * Evitar registrar dos veces
   * el mismo punto durante el recorrido.
   */
  if (puntosRecorridos.has(codigo)) {

    mostrarError(
      "⚠ Este punto ya fue registrado en este recorrido.\n\n" +
      codigo
    );

    setTimeout(function() {

      escaneoProcesado = false;

    }, 1800);

    return;
  }


  mostrarResultado(
    "QR leído: " + codigo
  );


  enviarAlBackend(codigo);

}


/* =====================================================
   ENVIAR A APPS SCRIPT
   ===================================================== */

function enviarAlBackend(codigo) {

  if (
    !URL_BACKEND ||
    URL_BACKEND.includes("PEGA_AQUI")
  ) {

    mostrarError(
      "La URL del backend todavía no está configurada."
    );

    escaneoProcesado = false;

    return;

  }


  if (!idRecorrido) {

    mostrarError(
      "No existe un recorrido activo."
    );

    escaneoProcesado = false;

    return;

  }


  const usuario =
    document.getElementById("usuario").value;


  const callback =
    "sigerRespuesta";


  const url =
    URL_BACKEND +
    "?accion=registrar" +
    "&codigo=" +
    encodeURIComponent(codigo) +
    "&usuario=" +
    encodeURIComponent(usuario) +
    "&idRecorrido=" +
    encodeURIComponent(idRecorrido) +
    "&callback=" +
    callback;


  const script =
    document.createElement("script");


  script.src = url;


  script.onerror = function() {

    mostrarError(
      "No fue posible registrar el escaneo."
    );

    escaneoProcesado = false;

    script.remove();

  };


  document.body.appendChild(script);

}


/* =====================================================
   RESPUESTA DEL BACKEND
   ===================================================== */

function sigerRespuesta(respuesta) {

  if (respuesta.ok) {

    /*
     * Guardamos el código como registrado
     */
    puntosRecorridos.add(
      respuesta.codigo
    );


    /*
     * Agregamos al historial visual
     */
    historialRecorrido.push({

      codigo:
        respuesta.codigo,

      punto:
        respuesta.punto ||
        "Sin nombre",

      piso:
        respuesta.piso ||
        "",

      hora:
        new Date()

    });


    mostrarHistorial();


    const mensaje = `
      ✓ PUNTO IDENTIFICADO

      ${respuesta.punto || "Sin nombre"}

      ${respuesta.piso || ""}

      Código: ${respuesta.codigo}

      Estado: ${respuesta.estado || "Sin estado"}
    `;


    mostrarResultado(mensaje);

  } else {

    mostrarError(
      "⚠ " +
      (
        respuesta.mensaje ||
        "El punto no pudo ser identificado."
      )
    );

  }


  setTimeout(function() {

    escaneoProcesado = false;

  }, 1500);

}

/* =====================================================
   MENSAJES
   ===================================================== */

function mostrarResultado(mensaje) {

  const resultado =
    document.getElementById("resultado");

  resultado.className =
    "status success";

  resultado.textContent =
    mensaje;

}

  function mostrarHistorial() {

  const lista =
    document.getElementById(
      "listaHistorial"
    );


  if (!lista) {
    return;
  }

    const cantidad =
  document.getElementById(
    "cantidadPuntos"
  );

const ultimo =
  document.getElementById(
    "ultimoPunto"
  );

if (cantidad) {

  cantidad.textContent =
    historialRecorrido.length;

}

if (ultimo) {

  if (historialRecorrido.length > 0) {

    ultimo.textContent =
      historialRecorrido[
        historialRecorrido.length - 1
      ].codigo;

  } else {

    ultimo.textContent =
      "—";

  }

}

  if (historialRecorrido.length === 0) {

    lista.textContent =
      "Aún no hay puntos registrados.";

    return;

  }


  /*
   * Mostramos primero los más recientes.
   * Limitamos visualmente a los últimos 8.
   */

  const ultimos =
    historialRecorrido
      .slice(-8)
      .reverse();


  lista.innerHTML =
    ultimos.map(function(item) {

      return `
        <div class="historial-item">

          <div class="historial-codigo">
            ✓ ${item.codigo}
          </div>

          <div>
            ${item.punto}
          </div>

          <div>
            ${item.piso}
          </div>

          <div class="historial-hora">
            ${item.hora.toLocaleTimeString()}
          </div>

        </div>
      `;

    }).join("");

}

function mostrarError(mensaje) {

  const resultado =
    document.getElementById("resultado");

  resultado.className =
    "status error";

  resultado.textContent =
    mensaje;

}


/* =====================================================
   ERROR DEL ESCÁNER
   ===================================================== */

function errorEscaneo(error) {

  // No mostramos los errores normales
  // mientras el lector busca un QR.

}


/* =====================================================
   VOLVER
   ===================================================== */

function volverInicio() {

  if (scannerQR) {

    scannerQR.stop()

      .then(function() {

        scannerQR.clear();

        scannerQR = null;

        mostrarInicio();

      })

      .catch(function() {

        mostrarInicio();

      });

  } else {

    mostrarInicio();

  }

}


function mostrarInicio() {

  document.getElementById("scanner").style.display =
    "none";

  document.getElementById("inicio").style.display =
    "block";

  document.getElementById("resultado").className =
    "status";

  document.getElementById("resultado").textContent =
    "Esperando código QR...";

  puntosRecorridos = new Set();

historialRecorrido = [];

mostrarHistorial();

idRecorrido = null;

}

</script>

</body>

</html>
